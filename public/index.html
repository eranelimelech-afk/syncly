<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desk — מחולל פרומפטים למסחר</title>
<style>
  :root{
    --ink:#0e1116;
    --ink-2:#141922;
    --panel:#1a212c;
    --panel-2:#212a37;
    --line:#2c3645;
    --line-2:#3a4759;
    --txt:#e8edf4;
    --txt-dim:#9aa7b8;
    --txt-faint:#697587;
    --amber:#f5a623;
    --amber-soft:#f5a62322;
    --teal:#3fb8af;
    --up:#46c98b;
    --down:#e8615a;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--txt);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  code,.mono,.tick,.fmtnum,.copybtn,.placeholder-chip,.field-label,.brand-sub{
    font-family:"SF Mono","JetBrains Mono","Consolas",ui-monospace,monospace;
  }

  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}

  /* ============ SIDEBAR ============ */
  .rail{
    background:var(--ink-2);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .brand{
    padding:22px 22px 18px;
    border-bottom:1px solid var(--line);
  }
  .brand-mark{display:flex;align-items:baseline;gap:9px}
  .brand-name{font-size:21px;font-weight:800;letter-spacing:-0.5px}
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 10px 1px var(--amber);align-self:center}
  .brand-sub{font-size:10.5px;color:var(--txt-faint);letter-spacing:1.5px;
    margin-top:6px;text-transform:uppercase}

  .rail-scroll{overflow-y:auto;flex:1;padding:10px 0;min-height:0}
  .rail-scroll::-webkit-scrollbar{width:8px}
  .rail-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

  .navitem{
    display:flex;align-items:center;gap:13px;
    padding:11px 22px;cursor:pointer;border:none;background:none;
    width:100%;text-align:right;color:var(--txt-dim);
    border-right:2px solid transparent;transition:.15s;
    font-family:inherit;
  }
  .navitem:hover{background:var(--panel);color:var(--txt)}
  .navitem.active{
    background:linear-gradient(270deg,var(--amber-soft),transparent);
    color:var(--txt);border-right-color:var(--amber);
  }
  .fmtnum{
    font-size:11px;color:var(--txt-faint);min-width:22px;
    font-weight:600;letter-spacing:.5px;
  }
  .navitem.active .fmtnum{color:var(--amber)}
  .navlabel{font-size:13.5px;font-weight:500;line-height:1.3}
  .navsep{height:1px;background:var(--line);margin:9px 18px}

  /* ============ MAIN ============ */
  .stage{
    min-height:0;overflow-y:auto;
    background:
      radial-gradient(1200px 600px at 80% -10%, #18202c 0%, transparent 60%),
      var(--ink);
  }
  .stage::-webkit-scrollbar{width:10px}
  .stage::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

  .screen{max-width:860px;margin:0 auto;padding:38px 40px 70px}

  .crumb{
    display:flex;align-items:center;gap:10px;
    font-size:11px;color:var(--txt-faint);letter-spacing:1px;
    text-transform:uppercase;margin-bottom:18px;
  }
  .crumb .sep{color:var(--line-2)}
  .crumb .cur{color:var(--amber)}

  .screen h1{
    font-size:30px;font-weight:800;letter-spacing:-0.6px;margin-bottom:8px;
  }
  .screen .lede{
    color:var(--txt-dim);font-size:14.5px;line-height:1.6;max-width:62ch;
    margin-bottom:30px;
  }

  /* fields */
  .fields{display:flex;flex-direction:column;gap:22px;margin-bottom:30px}
  .field{}
  .field-label{
    display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--teal);letter-spacing:1px;
    text-transform:uppercase;margin-bottom:11px;font-weight:600;
  }
  .field-label .ph{color:var(--txt-faint)}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    padding:9px 15px;border-radius:99px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);
    color:var(--txt-dim);font-size:13px;font-weight:500;
    transition:.14s;font-family:inherit;
  }
  .chip:hover{border-color:var(--line-2);color:var(--txt)}
  .chip.on{
    background:var(--amber);border-color:var(--amber);color:#1a1206;
    font-weight:700;
  }

  /* top-5 growth sectors panel */
  .toppanel{
    margin-bottom:18px;border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(180deg,#16202b,var(--ink-2));
  }
  .topp-head{
    padding:13px 16px;border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:3px;
    background:#141c26;
  }
  .topp-title{font-size:13px;font-weight:700;color:var(--up)}
  .topp-sub{font-size:10.5px;color:var(--txt-faint);
    font-family:"SF Mono",monospace;letter-spacing:.3px}
  .topp-sub .live{color:var(--up)}
  .toprows{display:flex;flex-direction:column}
  .toprow{
    display:grid;
    grid-template-columns:26px 150px 64px auto;
    grid-template-areas:"rank name perf tag" "rank note note add";
    gap:2px 11px;align-items:center;
    padding:11px 16px;cursor:pointer;border:none;background:none;
    text-align:right;color:var(--txt);width:100%;
    border-bottom:1px solid var(--line);transition:.13s;font-family:inherit;
  }
  .toprow:last-child{border-bottom:none}
  .toprow:hover{background:var(--panel)}
  .toprow.on{background:var(--amber-soft)}
  .toprank{grid-area:rank;font-family:"SF Mono",monospace;font-weight:700;
    color:var(--amber);font-size:14px;text-align:center}
  .topname{grid-area:name;font-weight:700;font-size:14px;
    font-family:"SF Mono",monospace}
  .topperf{grid-area:perf;font-family:"SF Mono",monospace;font-weight:700;
    font-size:13px;color:var(--up);text-align:left;direction:ltr}
  .toptag{grid-area:tag;font-size:10px;color:var(--teal);
    text-transform:uppercase;letter-spacing:.5px;text-align:left;
    font-family:"SF Mono",monospace}
  .topnote{grid-area:note;font-size:12px;color:var(--txt-dim);line-height:1.5}
  .topadd{grid-area:add;font-size:11px;font-weight:700;color:var(--txt-faint);
    font-family:"SF Mono",monospace;white-space:nowrap;text-align:left}
  .toprow.on .topadd{color:var(--up)}
  .toprow.on .toprank{color:var(--up)}
  @media(max-width:560px){
    .toprow{grid-template-columns:24px 1fr auto;
      grid-template-areas:"rank name perf" "rank tag add" "rank note note";}
    .topperf{text-align:left}
  }

  .freeinput{
    margin-top:11px;width:100%;
    background:var(--ink-2);border:1px solid var(--line);
    border-radius:8px;padding:11px 14px;color:var(--txt);
    font-size:13.5px;font-family:inherit;transition:.14s;
  }
  .freeinput::placeholder{color:var(--txt-faint)}
  .freeinput:focus{outline:none;border-color:var(--amber);
    box-shadow:0 0 0 3px var(--amber-soft)}

  /* ============ PROMPT PANEL ============ */
  .promptcard{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .promptcard-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .pc-title{
    display:flex;align-items:center;gap:9px;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--txt-faint);font-family:"SF Mono",monospace;
  }
  .pc-dots{display:flex;gap:6px}
  .pc-dots i{width:9px;height:9px;border-radius:50%;display:block}
  .pc-dots i:nth-child(1){background:#e8615a}
  .pc-dots i:nth-child(2){background:#f5a623}
  .pc-dots i:nth-child(3){background:#46c98b}

  .copybtn{
    display:flex;align-items:center;gap:7px;
    background:var(--amber);color:#1a1206;border:none;
    padding:7px 14px;border-radius:7px;cursor:pointer;
    font-size:12px;font-weight:700;letter-spacing:.5px;transition:.14s;
  }
  .copybtn:hover{filter:brightness(1.08)}
  .copybtn.done{background:var(--up);color:#06210f}
  .pc-actions{display:flex;gap:8px;align-items:center}
  .copybtn.ghost{background:transparent;color:var(--txt-dim);
    border:1px solid var(--line-2)}
  .copybtn.ghost:hover{border-color:var(--amber);color:var(--amber);filter:none}
  .copybtn:disabled{opacity:.6;cursor:wait}

  /* result panel */
  #resultwrap{margin-top:18px}
  .resultcard{
    background:var(--ink-2);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;
    animation:fade .3s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .result-head{
    display:flex;align-items:center;gap:9px;
    padding:12px 16px;border-bottom:1px solid var(--line);
    background:var(--panel);font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--txt-faint);
    font-family:"SF Mono",monospace;
  }
  .rh-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 9px var(--teal)}
  .rh-load{margin-right:auto;color:var(--amber);
    text-transform:none;letter-spacing:0;font-size:11px;
    animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .result-body{padding:20px;font-size:14.5px;line-height:1.8;color:var(--txt)}
  .result-body h3{font-size:16px;margin:16px 0 8px;color:var(--amber)}
  .result-body h4{font-size:14px;margin:13px 0 6px;color:var(--teal)}
  .result-body p{margin:9px 0}
  .result-body ul{margin:9px 22px 9px 0;padding:0}
  .result-body li{margin:5px 0}
  .result-body strong{color:#fff}
  .disclaimer{margin-top:16px;padding:10px 13px;border-radius:8px;
    background:#2a1d0a;border:1px solid #4a3712;color:#d9a847;
    font-size:11.5px;line-height:1.5}
  .errbox{padding:12px;border-radius:8px;background:#2a1414;
    border:1px solid #4a1f1f;color:var(--down);font-size:13px}
  .skeleton{height:12px;border-radius:6px;margin:11px 0;
    background:linear-gradient(90deg,var(--panel),var(--panel-2),var(--panel));
    background-size:200% 100%;animation:shim 1.3s infinite}
  .skeleton.w70{width:70%}
  @keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .prompt-body{
    padding:22px 20px;font-size:14.5px;line-height:1.9;
    color:var(--txt);white-space:pre-wrap;word-break:break-word;
    direction:ltr;text-align:left;
    font-family:"SF Mono","JetBrains Mono","Consolas",monospace;
  }
  .slot{
    display:inline;background:var(--amber-soft);
    color:var(--amber);font-weight:700;
    padding:1px 7px;border-radius:5px;
    border:1px solid var(--amber);
  }
  .slot.empty{
    color:var(--txt-faint);background:transparent;
    border:1px dashed var(--line-2);font-weight:500;font-style:italic;
  }

  .hint{
    margin-top:18px;display:flex;gap:11px;align-items:flex-start;
    padding:13px 16px;border-radius:9px;
    background:var(--panel);border:1px solid var(--line);
    font-size:12.5px;color:var(--txt-dim);line-height:1.6;
  }
  .hint .i{color:var(--teal);font-weight:800;flex-shrink:0;
    font-family:monospace;font-size:14px}

  .footnote{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11px;color:var(--txt-faint);line-height:1.6;text-align:center;
  }

  /* history */
  .histlist{display:flex;flex-direction:column;gap:12px}
  .histcard{background:var(--ink-2);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px}
  .histcard .ht{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:8px}
  .histcard .ht .fmt{font-size:13px;font-weight:700;color:var(--amber)}
  .histcard .ht .ts{font-size:11px;color:var(--txt-faint);font-family:monospace;white-space:nowrap}
  .histcard .hp{font-size:12.5px;color:var(--txt-dim);line-height:1.6;
    direction:ltr;text-align:left;font-family:"SF Mono",monospace;
    white-space:pre-wrap;word-break:break-word;max-height:78px;overflow:hidden;
    margin-bottom:11px;border-right:2px solid var(--line);padding-right:10px}
  .histcard .ha{display:flex;gap:8px}
  .histempty{color:var(--txt-faint);font-size:14px;padding:24px 0}
  .smallbtn{font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;
    border-radius:7px;padding:6px 12px;border:1px solid var(--line-2);
    background:transparent;color:var(--txt-dim);transition:.14s}
  .smallbtn:hover{border-color:var(--amber);color:var(--amber)}
  .smallbtn.danger:hover{border-color:var(--down);color:var(--down)}
  .booterr{max-width:560px;margin:80px auto;padding:20px;border-radius:10px;
    background:#2a1414;border:1px solid #4a1f1f;color:var(--down);
    font-size:14px;line-height:1.7}

  .ticker{
    display:flex;gap:7px;align-items:center;margin-top:7px;
    font-size:12px;color:var(--txt-faint);font-family:monospace;
  }
  .up{color:var(--up)} .down{color:var(--down)}

  /* mobile */
  .mobtop{display:none}
  @media(max-width:820px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;height:auto}
    .rail{
      position:sticky;top:0;z-index:30;border-left:none;
      border-bottom:1px solid var(--line);
    }
    .brand{display:none}
    .mobtop{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;border-bottom:1px solid var(--line);
      background:var(--ink-2);
    }
    .mobtitle{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:18px}
    .rail-scroll{
      display:flex;flex-direction:row;overflow-x:auto;padding:8px;gap:6px;
    }
    .navsep{display:none}
    .navitem{
      flex-direction:column;align-items:flex-start;gap:3px;
      width:auto;white-space:nowrap;border-right:none;
      border-bottom:2px solid transparent;border-radius:8px;
      padding:9px 14px;min-width:130px;
    }
    .navitem.active{border-right-color:transparent;border-bottom-color:var(--amber)}
    .navlabel{font-size:12px}
    .screen{padding:26px 20px 60px}
    .screen h1{font-size:24px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <span class="brand-name">DESK</span>
      </div>
      <div class="brand-sub">Prompt Terminal · v1</div>
    </div>
    <div class="mobtop">
      <div class="mobtitle"><span class="brand-dot" style="width:7px;height:7px;border-radius:50%;background:var(--amber)"></span> DESK</div>
      <span style="font-size:11px;color:var(--txt-faint);font-family:monospace">PROMPT TERMINAL</span>
    </div>
    <nav class="rail-scroll" id="nav"></nav>
  </aside>

  <!-- MAIN STAGE -->
  <main class="stage" id="stage">
    <div class="screen" id="screen"></div>
  </main>
</div>

<script>
/* ---------- runtime state (loaded from formats.json) ---------- */
let FORMATS = [];
let BANKS = {};
let TOP_SECTORS = [];        // current ranking shown in the panel
let SECTORS_META = null;     // {live, asOf} from /api/sectors

let active = 0;
let view = "format";         // 'format' | 'history'
const state = {};            // {formatId: {fieldKey: [values]}}

/* ---------- small helpers ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function scrollTop(){ const st=document.getElementById('stage'); if(st) st.scrollTo({top:0,behavior:'smooth'}); }
function fmtTs(iso){
  try{ return new Date(iso).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch(_){ return ''; }
}
function expandOptions(arr){
  const out=[];
  (arr||[]).forEach(o=>{
    if(o==='@SECTORS') out.push(...(BANKS.SECTORS||[]));
    else if(o==='@STOCKS') out.push(...(BANKS.STOCKS||[]));
    else if(o==='@STRATS') out.push(...(BANKS.STRATS||[]));
    else out.push(o);
  });
  return out;
}

/* ---------- bootstrap ---------- */
async function boot(){
  try{
    const r=await fetch('formats.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    BANKS=data.banks||{};
    TOP_SECTORS=data.topSectorsFallback||[];
    FORMATS=(data.formats||[]).map(f=>({
      ...f,
      fields:(f.fields||[]).map(fd=>({...fd, options:expandOptions(fd.options)}))
    }));
    if(!FORMATS.length) throw new Error('no formats');
  }catch(e){
    document.getElementById('screen').innerHTML =
      `<div class="booterr">שגיאה בטעינת התבניות (formats.json). ודא/י שהקובץ קיים ושהשרת רץ, ורענן/י את הדף.</div>`;
    return;
  }
  FORMATS.forEach(f=>{ state[f.id]={}; f.fields.forEach(fd=>state[f.id][fd.key]=[]); });
  buildNav();
  render();
  setActiveNav();
  loadSectors(); // live feed; re-renders when ready
}

async function loadSectors(){
  try{
    const r=await fetch('/api/sectors',{cache:'no-store'});
    if(!r.ok) return;
    const d=await r.json();
    if(d && Array.isArray(d.topSectors) && d.topSectors.length){
      TOP_SECTORS=d.topSectors;
      SECTORS_META={live:!!d.live, asOf:d.asOf};
      if(view==='format') render();
    }
  }catch(_){ /* keep fallback */ }
}

/* ---------- nav ---------- */
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='';
  FORMATS.forEach((f,i)=>{
    const b=document.createElement('button');
    b.className='navitem';
    b.innerHTML=`<span class="fmtnum">${String(f.id).padStart(2,'0')}</span><span class="navlabel">${esc(f.he)}<br><span style="font-size:10px;color:var(--txt-faint);font-family:monospace">${esc(f.title)}</span></span>`;
    b.onclick=()=>{ view='format'; active=i; render(); setActiveNav(); scrollTop(); };
    nav.appendChild(b);
  });
  const sep=document.createElement('div'); sep.className='navsep'; nav.appendChild(sep);
  const h=document.createElement('button');
  h.className='navitem nav-history'; h.id='navhist';
  h.innerHTML=`<span class="fmtnum">★</span><span class="navlabel">היסטוריה<br><span style="font-size:10px;color:var(--txt-faint);font-family:monospace">History</span></span>`;
  h.onclick=()=>{ view='history'; renderHistory(); setActiveNav(); scrollTop(); };
  nav.appendChild(h);
}
function setActiveNav(){
  document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  if(view==='history'){ const hn=document.getElementById('navhist'); if(hn) hn.classList.add('active'); }
  else { const items=document.querySelectorAll('.navitem:not(.nav-history)'); if(items[active]) items[active].classList.add('active'); }
}

/* ---------- render format screen ---------- */
function render(){
  if(view==='history'){ renderHistory(); return; }
  const f=FORMATS[active];
  const s=document.getElementById('screen');

  const subText = SECTORS_META && SECTORS_META.live
    ? `<span class="live">● נתונים חיים</span> · ETFs לפי תשואת 3 חודשים${SECTORS_META.asOf?(' · עודכן '+esc(SECTORS_META.asOf)):''}`
    : `נתוני פולבק · מבוסס מחקר שוק (יוני 2026)`;

  const fieldsHTML = f.fields.map(fd=>{
    const sel = state[f.id][fd.key];
    const chips = fd.options.map(o=>{
      const on = sel.includes(o);
      return `<button class="chip${on?' on':''}" data-fid="${f.id}" data-fk="${esc(fd.key)}" data-val="${esc(o)}" data-multi="${!!fd.multi}">${esc(o)}</button>`;
    }).join('');
    const freeVal = sel.filter(v=>!fd.options.includes(v)).join(', ');
    const free = fd.free ? `<input class="freeinput" data-fid="${f.id}" data-fk="${esc(fd.key)}" placeholder="או הקלד/י ערך משלך…" value="${esc(freeVal)}">` : '';
    let topPanel='';
    if(fd.sectorTop){
      const rows=TOP_SECTORS.map((t,i)=>{
        const on=sel.includes(t.name);
        return `<button class="toprow${on?' on':''}" data-fid="${f.id}" data-fk="${esc(fd.key)}" data-val="${esc(t.name)}">
          <span class="toprank">${i+1}</span>
          <span class="topname">${esc(t.name)}</span>
          <span class="topperf">${esc(t.perf)}</span>
          <span class="toptag">${esc(t.tag||'')}</span>
          <span class="topnote">${esc(t.note||'')}</span>
          <span class="topadd">${on?'✓ נבחר':'+ הוסף'}</span>
        </button>`;
      }).join('');
      topPanel=`<div class="toppanel">
        <div class="topp-head">
          <span class="topp-title">⚡ 5 הסקטורים עם פוטנציאל הצמיחה הגבוה — 3 חודשים אחרונים</span>
          <span class="topp-sub">${subText}</span>
        </div>
        <div class="toprows">${rows}</div>
      </div>`;
    }
    return `<div class="field">
      ${topPanel}
      <div class="field-label">${esc(fd.label)} <span class="ph">${esc(fd.ph)}</span></div>
      <div class="chips">${chips}</div>
      ${free}
    </div>`;
  }).join('');

  s.innerHTML = `
    <div class="crumb">Prompt Terminal <span class="sep">/</span> Format ${String(f.id).padStart(2,'0')} <span class="sep">/</span> <span class="cur">${esc(f.title)}</span></div>
    <h1>${esc(f.he)}</h1>
    <p class="lede">${esc(f.lede)}</p>
    <div class="fields">${fieldsHTML}</div>
    <div class="promptcard">
      <div class="promptcard-head">
        <div class="pc-title"><span class="pc-dots"><i></i><i></i><i></i></span> assembled-prompt.txt</div>
        <div class="pc-actions">
          <button class="copybtn ghost" id="copy"><span>COPY</span></button>
          <button class="copybtn" id="run"><span>▶ הרץ</span></button>
        </div>
      </div>
      <div class="prompt-body" id="pbody"></div>
    </div>
    <div id="resultwrap"></div>
    <div class="hint"><span class="i">i</span><span>בחר/י ערך אחד או יותר מהצ'יפים, או הקלד/י ערך חופשי. הפרומפט מתעדכן בזמן אמת — COPY מעתיק אותו, ו-▶ הרץ שולח אותו למודל ומציג את התשובה בזרימה (streaming). כל הרצה נשמרת בהיסטוריה.</span></div>
    <div class="footnote">⚠ DESK הוא כלי חינוכי / מחקרי בלבד. התוכן והתשובות אינם מהווים ייעוץ השקעות, שיווק השקעות או המלצה לפעולה. אין להסתמך עליהם לקבלת החלטות פיננסיות.</div>
  `;

  // chip handlers
  s.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{
      const {fid,fk,val,multi}=c.dataset;
      const arr=state[fid][fk];
      const idx=arr.indexOf(val);
      if(multi==='true'){ idx>-1?arr.splice(idx,1):arr.push(val); }
      else {
        const opts=FORMATS[active].fields.find(x=>x.key===fk).options;
        const free=arr.filter(v=>!opts.includes(v));
        state[fid][fk]= idx>-1 ? free : [...free,val];
      }
      render();
    };
  });
  // top-sector rows (multi add/remove)
  s.querySelectorAll('.toprow').forEach(r=>{
    r.onclick=()=>{
      const {fid,fk,val}=r.dataset;
      const arr=state[fid][fk];
      const idx=arr.indexOf(val);
      idx>-1?arr.splice(idx,1):arr.push(val);
      render();
    };
  });
  // free input
  s.querySelectorAll('.freeinput').forEach(inp=>{
    inp.oninput=()=>{
      const {fid,fk}=inp.dataset;
      const opts=FORMATS[active].fields.find(x=>x.key===fk).options;
      const chosen=state[fid][fk].filter(v=>opts.includes(v));
      const typed=inp.value.split(',').map(t=>t.trim()).filter(Boolean);
      state[fid][fk]=[...chosen,...typed];
      paintPrompt();
    };
  });

  document.getElementById('copy').onclick=copyPrompt;
  document.getElementById('run').onclick=runPrompt;
  paintPrompt();
}

/* ---------- assemble + paint prompt ---------- */
function paintPrompt(){
  const f=FORMATS[active];
  const display = String(f.template).replace(/\{(\w+)\}/g,(m,k)=>{
    const vals=state[f.id][k]||[];
    if(!vals.length){
      const fd=f.fields.find(x=>x.key===k);
      return `<span class="slot empty">${esc(fd?fd.ph:('['+k+']'))}</span>`;
    }
    return `<span class="slot">${esc(vals.join(', '))}</span>`;
  });
  const body=document.getElementById('pbody');
  if(body) body.innerHTML=display;
}
function plainPrompt(){
  const f=FORMATS[active];
  return String(f.template).replace(/\{(\w+)\}/g,(m,k)=>{
    const vals=state[f.id][k]||[];
    if(!vals.length){ const fd=f.fields.find(x=>x.key===k); return fd?fd.ph:('['+k+']'); }
    return vals.join(', ');
  });
}
function copyPrompt(){
  const btn=document.getElementById('copy');
  navigator.clipboard.writeText(plainPrompt()).then(()=>{
    btn.classList.add('done');btn.querySelector('span').textContent='COPIED ✓';
    setTimeout(()=>{btn.classList.remove('done');btn.querySelector('span').textContent='COPY';},1400);
  }).catch(()=>{
    btn.querySelector('span').textContent='—';
    setTimeout(()=>btn.querySelector('span').textContent='COPY',1400);
  });
}

/* ---------- minimal markdown ---------- */
function mdLite(t){
  let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^### (.+)$/gm,'<h4>$1</h4>');
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^# (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^\s*[-*] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,m=>'<ul>'+m+'</ul>').replace(/<\/ul>\s*<ul>/g,'');
  h=h.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return '<p>'+h+'</p>';
}

/* ---------- history (localStorage) ---------- */
const HKEY='desk_history';
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HKEY)||'[]'); }catch(_){ return []; } }
function saveHist(list){ try{ localStorage.setItem(HKEY, JSON.stringify(list.slice(0,30))); }catch(_){} }
function startHistory(prompt){
  const f=FORMATS[active];
  const id=Date.now();
  const entry={ id, ts:new Date().toISOString(), formatId:f.id, formatTitle:f.title, he:f.he,
    prompt, response:'', snapshot:JSON.parse(JSON.stringify(state[f.id])) };
  const l=loadHist(); l.unshift(entry); saveHist(l);
  return id;
}
function finishHistory(id, response){
  const l=loadHist(); const e=l.find(x=>x.id===id); if(e){ e.response=response; saveHist(l); }
}
function restoreHistory(id){
  const h=loadHist().find(x=>x.id===id); if(!h) return;
  const idx=FORMATS.findIndex(f=>f.id===h.formatId); if(idx<0) return;
  active=idx; view='format';
  if(h.snapshot) state[h.formatId]=JSON.parse(JSON.stringify(h.snapshot));
  render(); setActiveNav(); scrollTop();
}
function renderHistory(){
  const s=document.getElementById('screen');
  const list=loadHist();
  const rows=list.map(h=>`
    <div class="histcard">
      <div class="ht"><span class="fmt">${esc(h.he)} · ${esc(h.formatTitle)}</span><span class="ts">${esc(fmtTs(h.ts))}</span></div>
      <div class="hp">${esc(h.prompt)}</div>
      <div class="ha">
        <button class="smallbtn" data-act="restore" data-id="${h.id}">↩ שחזר</button>
        <button class="smallbtn danger" data-act="del" data-id="${h.id}">🗑 מחק</button>
      </div>
    </div>`).join('');
  s.innerHTML=`
    <div class="crumb">Prompt Terminal <span class="sep">/</span> <span class="cur">History</span></div>
    <h1>היסטוריה</h1>
    <p class="lede">הפרומפטים האחרונים שהרצת, נשמרים מקומית בדפדפן (עד 30). "שחזר" טוען בחזרה את הפורמט והבחירות.</p>
    ${ list.length
        ? `<div style="margin-bottom:16px"><button class="smallbtn danger" id="clearhist">נקה הכל</button></div><div class="histlist">${rows}</div>`
        : `<div class="histempty">אין עדיין היסטוריה. הרץ פרומפט (▶ הרץ) והוא יישמר כאן.</div>` }
    <div class="footnote">⚠ DESK הוא כלי חינוכי / מחקרי בלבד. התוכן והתשובות אינם מהווים ייעוץ השקעות.</div>
  `;
  const clr=document.getElementById('clearhist');
  if(clr) clr.onclick=()=>{ saveHist([]); renderHistory(); };
  s.querySelectorAll('.smallbtn[data-act]').forEach(b=>{
    b.onclick=()=>{
      const id=Number(b.dataset.id);
      if(b.dataset.act==='del'){ saveHist(loadHist().filter(x=>x.id!==id)); renderHistory(); }
      else if(b.dataset.act==='restore'){ restoreHistory(id); }
    };
  });
}

/* ---------- run prompt (streaming via /api/run SSE) ---------- */
async function runPrompt(){
  const btn=document.getElementById('run');
  const wrap=document.getElementById('resultwrap');
  btn.disabled=true;
  const orig=btn.querySelector('span').textContent;
  btn.querySelector('span').textContent='…מריץ';

  const promptText=plainPrompt();
  const histId=startHistory(promptText);

  wrap.innerHTML=`<div class="resultcard">
      <div class="result-head"><span class="rh-dot"></span> CLAUDE · תשובה<span class="rh-load">מנתח את השוק…</span></div>
      <div class="result-body" id="rbody"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton w70"></div></div>
    </div>`;
  wrap.scrollIntoView({behavior:'smooth',block:'nearest'});
  const rb=document.getElementById('rbody');
  const disc=`<div class="disclaimer">⚠ תוכן חינוכי בלבד, לא ייעוץ השקעות. נתוני שוק עשויים להיות לא מעודכנים.</div>`;
  let acc='', firstChunk=true, errored=false;
  const dropLoader=()=>{ const l=document.querySelector('.rh-load'); if(l) l.remove(); };

  try{
    const res=await fetch('/api/run',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:promptText})
    });
    if(!res.ok || !res.body){
      const d=await res.json().catch(()=>({}));
      throw new Error(d && d.error ? d.error : ('HTTP '+res.status));
    }
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    while(true){
      const {value,done}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n\n'))>=0){
        const block=buf.slice(0,nl); buf=buf.slice(nl+2);
        const line=block.split('\n').find(l=>l.startsWith('data:'));
        if(!line) continue;
        let evt; try{ evt=JSON.parse(line.slice(5).trim()); }catch(_){ continue; }
        if(evt.type==='delta'){
          if(firstChunk){ dropLoader(); firstChunk=false; }
          acc+=evt.text;
          rb.innerHTML=mdLite(acc)+disc;
        }else if(evt.type==='error'){
          errored=true; dropLoader();
          rb.innerHTML=`<div class="errbox">${esc(evt.error||'החיבור נכשל.')}</div>`;
        }else if(evt.type==='done'){
          dropLoader();
          rb.innerHTML=mdLite(acc||'לא התקבלה תשובה. נסה/י שוב.')+disc;
        }
      }
    }
    if(!errored) finishHistory(histId, acc);
  }catch(e){
    dropLoader();
    if(rb) rb.innerHTML=`<div class="errbox">החיבור נכשל. ודא/י חיבור לרשת ונסה/י שוב.</div>`;
  }finally{
    btn.disabled=false; btn.querySelector('span').textContent=orig;
  }
}

boot();
</script>
